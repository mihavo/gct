server:
  listen_address: 'localhost'
  port: 8080
  enable_ssl: true

limiter:
  bucket_size: 10
  refill_rate:
    tokens: 1
    per: 1s

jwks_refresh_interval_minutes: 5

routes:
  - name: "users"
    prefix: "/users"
    location: "http://localhost:8081"

  - name: "orders"
    prefix: "/orders"
    location: "http://localhost:8082"

  - name: "payments"
    prefix: "/payments"
    location: "http://localhost:8083"

  - name: "search"
    prefix: "/search"
    location: "http://localhost:8084"

  - name: "inventory"
    prefix: "/inventory"
    location: "http://localhost:8085"

  - name: "billing"
    prefix: "/billing"
    location: "http://localhost:8086"