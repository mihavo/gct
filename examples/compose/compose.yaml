name: gct-demo

services:
  gate:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      GATE_CONFIG_PATH: /etc/gct/gate.yml
    volumes:
      - ./gate.yml:/etc/gct/gate.yml:ro
    ports:
      - "8080:8080"
    stop_grace_period: 10s
    depends_on:
      - auth
      - service1

  checker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: checker
    environment:
      CHECKER_CONFIG_PATH: /etc/gct/checker.yml
      TZ: ${TZ:-Europe/Athens}
    volumes:
      - ./checker.yml:/etc/gct/checker.yml:ro
    tty: true
    stop_grace_period: 10s
    depends_on:
      - gate

  auth:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: auth

  service1:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: service1
