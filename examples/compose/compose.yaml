name: gct-demo

services:
  gate:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      GATE_CONFIG_PATH: /etc/gct/gate.yml
      LIMITER_REDIS_ADDR: redis:6379
      LIMITER_REDIS_PASSWORD: ""
      LIMITER_REDIS_DB: "0"
    volumes:
      - ./gate.yml:/etc/gct/gate.yml:ro
    ports:
      - "8080:8080"
    stop_grace_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      auth:
        condition: service_started
      service1:
        condition: service_started
      users:
        condition: service_started
      orders:
        condition: service_started
      payments:
        condition: service_started
      search:
        condition: service_started
      inventory:
        condition: service_started
      billing:
        condition: service_started

  checker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        CMD: checker
    environment:
      CHECKER_CONFIG_PATH: /etc/gct/checker.yml
      TZ: ${TZ:-Europe/Athens}
    volumes:
      - ./checker.yml:/etc/gct/checker.yml:ro
    tty: true
    stop_grace_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  auth:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: auth

  service1:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: service1

  users:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: users

  orders:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: orders

  payments:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: payments

  search:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: search

  inventory:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: inventory

  billing:
    image: traefik/whoami
    environment:
      WHOAMI_NAME: billing
