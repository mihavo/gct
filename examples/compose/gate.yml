server:
  listen_address: "0.0.0.0"
  port: 8080
  enable_ssl: false

limiter:
  bucket_size: 10
  refill_rate:
    tokens: 1
    per: 1s

routes:
  - name: "auth"
    prefix: "/auth"
    location: "http://auth:80"

  - name: "service1"
    prefix: "/service1"
    location: "http://service1:80"

  - name: "users"
    prefix: "/users"
    location: "http://users:80"

  - name: "orders"
    prefix: "/orders"
    location: "http://orders:80"

  - name: "payments"
    prefix: "/payments"
    location: "http://payments:80"

  - name: "search"
    prefix: "/search"
    location: "http://search:80"

  - name: "inventory"
    prefix: "/inventory"
    location: "http://inventory:80"

  - name: "billing"
    prefix: "/billing"
    location: "http://billing:80"
